service: bronze-x

frameworkVersion: '3'
configValidationMode: error

provider:
  name: aws
  runtime: python3.11
  region: eu-central-1
  stage: dev
  architecture: x86_64
  timeout: 120
  memorySize: 512
  environment:
    DATA_LAKE_BUCKET: ftn-social-data-pipeline-2026
    STAGING_BUCKET: ftn-social-staging-2026
    STAGING_FILE_KEY: bitcoin_tweets_sample.csv
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
          Resource:
            - arn:aws:s3:::ftn-social-staging-2026/*
        - Effect: Allow
          Action:
            - s3:PutObject
          Resource:
            - arn:aws:s3:::ftn-social-data-pipeline-2026/bronze/x/*
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: "*"

package:
  individually: true
  patterns:
    - '!**'
    - 'src/**'

functions:
  bronzeX:
    name: bronze-x-ingestion
    handler: src.handler.lambda_handler
    events:
      - schedule:
          name: daily-hackernews-ingestion-trigger
          description: "Automatically triggers Hacker News data ingestion every day at 01:00 UTC"
          rate: cron(0 1 * * ? *) # Runs at 01:00 AM UTC every day
          enabled: true