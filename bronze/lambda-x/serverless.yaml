service: bronze-x

frameworkVersion: '3'
configValidationMode: error

provider:
  name: aws
  runtime: python3.11
  region: eu-central-1
  stage: dev
  architecture: x86_64
  timeout: 120
  memorySize: 512
  environment:
    DATA_LAKE_BUCKET: ftn-social-data-pipeline-2026
    STAGING_BUCKET: ftn-social-staging-2026
    STAGING_FILE_KEY: bitcoin_tweets_sample.csv
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
          Resource:
            - arn:aws:s3:::ftn-social-staging-2026/*
        - Effect: Allow
          Action:
            - s3:PutObject
          Resource:
            - arn:aws:s3:::ftn-social-data-pipeline-2026/bronze/x/*
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: "*"
          
  vpc:
    securityGroupIds:
      - "Fn::ImportValue": "infra-vpc-dev-LambdaSecurityGroupId"
    subnetIds:
      - "Fn::ImportValue": "infra-vpc-dev-PrivateSubnetA"
      - "Fn::ImportValue": "infra-vpc-dev-PrivateSubnetB"        

package:
  individually: true
  patterns:
    - '!**'
    - 'src/**'

functions:
  bronzeX:
    name: bronze-x-ingestion
    handler: src.handler.lambda_handler

resources:
  Resources:
    BronzeXErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: bronze-x-ingestion-errors
        AlarmDescription: Sends Discord notification whenever the Bronze X ingestion Lambda execution fails.

        Namespace: AWS/Lambda
        MetricName: Errors

        Dimensions:
          - Name: FunctionName
            Value: bronze-x-ingestion

        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 0

        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching

        AlarmActions:
          - ${cf:lambda-discord-notifier-dev.PipelineFailuresTopicArn}