service: bronze-hackernews

frameworkVersion: '3'
configValidationMode: error

plugins:
  - serverless-python-requirements

provider:
  name: aws
  runtime: python3.11
  region: eu-central-1
  stage: dev
  architecture: x86_64
  timeout: 120
  memorySize: 512
  environment:
    BUCKET_NAME: ftn-social-data-pipeline-2026
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
          Resource:
            - arn:aws:s3:::ftn-social-data-pipeline-2026/bronze/hackernews/*
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: "*"
  vpc:
    securityGroupIds:
      - "Fn::ImportValue": "infra-vpc-dev-LambdaSecurityGroupId"
    subnetIds:
      - "Fn::ImportValue": "infra-vpc-dev-PrivateSubnetA"
      - "Fn::ImportValue": "infra-vpc-dev-PrivateSubnetB"
package:
  individually: true
  patterns:
    - '!**'
    - 'src/**'

custom:
  pythonRequirements:
    dockerizePip: false
    slim: true

functions:
  bronzeHackerNews:
    name: bronze-hackernews-ingestion
    handler: src.handler.lambda_handler

resources:
  Resources:
    BronzeHackerNewsErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: bronze-hackernews-ingestion-errors
        AlarmDescription: Sends Discord notification whenever Bronze HackerNews ingestion Lambda fails.

        Namespace: AWS/Lambda
        MetricName: Errors

        Dimensions:
          - Name: FunctionName
            Value: bronze-hackernews-ingestion

        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 0

        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching

        AlarmActions:
          - Fn::ImportValue: pipeline-failures-topic-arn