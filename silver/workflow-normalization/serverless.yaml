service: silver-normalization-workflow

frameworkVersion: '3'
configValidationMode: error

plugins:
  - serverless-step-functions

provider:
  name: aws
  region: eu-central-1
  stage: dev

stepFunctions:
  stateMachines:
    silverNormalizationWorkflow:
      name: silver-normalization-workflow
      definition:
        Comment: "Silver layer normalization workflow"
        StartAt: ValidateBronzeInputs
        States:
          ValidateBronzeInputs:
            Type: Task
            Resource: arn:aws:lambda:eu-central-1:${aws:accountId}:function:silver-validate-bronze-inputs
            Next: ParallelNormalize

          ParallelNormalize:
            Type: Parallel
            Branches:
              - StartAt: NormalizeHnPosts
                States:
                  NormalizeHnPosts:
                    Type: Task
                    Resource: arn:aws:lambda:eu-central-1:${aws:accountId}:function:silver-hn-posts-normalizer
                    End: true

              - StartAt: NormalizeHnUsers
                States:
                  NormalizeHnUsers:
                    Type: Task
                    Resource: arn:aws:lambda:eu-central-1:${aws:accountId}:function:silver-hn-users-normalizer
                    End: true

              - StartAt: NormalizeXPosts
                States:
                  NormalizeXPosts:
                    Type: Task
                    Resource: arn:aws:lambda:eu-central-1:${aws:accountId}:function:silver-x-posts-normalizer
                    End: true

              - StartAt: NormalizeXUsers
                States:
                  NormalizeXUsers:
                    Type: Task
                    Resource: arn:aws:lambda:eu-central-1:${aws:accountId}:function:silver-x-users-normalizer
                    End: true

            Next: QualityChecks

          QualityChecks:
            Type: Task
            Resource: arn:aws:lambda:eu-central-1:${aws:accountId}:function:silver-quality-checks
            End: true