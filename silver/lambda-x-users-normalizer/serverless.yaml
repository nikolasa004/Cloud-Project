service: silver-x-users-normalizer

frameworkVersion: '3'
configValidationMode: error

provider:
  name: aws
  runtime: python3.11
  region: eu-central-1
  stage: dev
  architecture: x86_64
  timeout: 120
  memorySize: 512

package:
  individually: true
  patterns:
    - '!**'
    - 'src/**'

functions:
  xUsersNormalizer:
    name: silver-x-users-normalizer
    handler: src.handler.lambda_handler